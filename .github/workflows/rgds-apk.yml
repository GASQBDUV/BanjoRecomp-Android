name: RG DS APK

# Builds the RG DS variant without a ROM: the Java layer is recompiled from
# this branch and swapped into the official release APK, whose native
# libraries (the recompiled game) are kept as they are. That only works while
# the Java sources match the release, so BASE_TAG must be the tag this branch
# is based on.

on:
  push:
    branches: [rgds]
  workflow_dispatch:

permissions:
  contents: write

env:
  BASE_TAG: android-v0.1.2
  BASE_APK: BanjoRecompiled-v0.1.2-Android-ARM64.apk
  APKTOOL: 2.12.1
  API: '36'
  BUILD_TOOLS: '36.0.0'

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK platform and build tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-${API}" "build-tools;${BUILD_TOOLS}"
          echo "BT=$ANDROID_HOME/build-tools/${BUILD_TOOLS}" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-${API}/android.jar" >> "$GITHUB_ENV"

      - name: Download official APK and apktool
        run: |
          mkdir -p work
          curl -fsSL -o work/base.apk \
            "https://github.com/AurelioB/BanjoRecomp-Android/releases/download/${BASE_TAG}/${BASE_APK}"
          curl -fsSL -o work/apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL}/apktool_${APKTOOL}.jar"

      - name: Compile Java layer to dex
        run: |
          set -euo pipefail
          java -jar work/apktool.jar d -f -s -o work/dec work/base.apk
          vcode=$(sed -n 's/^  versionCode: *//p' work/dec/apktool.yml | tr -d "'")
          vname=$(sed -n 's/^  versionName: *//p' work/dec/apktool.yml | tr -d "'")
          mkdir -p work/gen/io/github/banjorecomp work/classes work/dex
          cat > work/gen/io/github/banjorecomp/BuildConfig.java <<JAVA
          package io.github.banjorecomp;
          public final class BuildConfig {
            public static final boolean DEBUG = false;
            public static final String APPLICATION_ID = "com.aure.banjorecomp";
            public static final String BUILD_TYPE = "release";
            public static final int VERSION_CODE = ${vcode};
            public static final String VERSION_NAME = "${vname}-rgds";
            public static final boolean BANJO_BUNDLE_DEV_ROMS = false;
            public static final boolean BANJO_DUAL_SCREEN_DEBUG = false;
          }
          JAVA
          find android/app/src/main/java work/gen -name '*.java' > work/sources.txt
          javac -source 8 -target 8 -nowarn -encoding UTF-8 \
            -bootclasspath "$ANDROID_JAR" -d work/classes @work/sources.txt
          "$BT/d8" --release --min-api 24 --lib "$ANDROID_JAR" --output work/dex \
            $(find work/classes -name '*.class')
          cp work/dex/classes.dex work/dec/classes.dex
          rm -f work/dec/classes[2-9].dex

      - name: Patch manifest and rebuild APK
        run: |
          set -euo pipefail
          python3 tools/rgds/patch_manifest.py work/dec/AndroidManifest.xml
          java -jar work/apktool.jar b work/dec -o work/unsigned.apk
          "$BT/zipalign" -P 16 -f 4 work/unsigned.apk work/aligned.apk
          "$BT/apksigner" sign --ks android/rgds.keystore --ks-pass pass:android \
            --ks-key-alias rgds --key-pass pass:android \
            --out banjo-rgds.apk work/aligned.apk
          "$BT/apksigner" verify banjo-rgds.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: rgds-build-${{ github.run_number }}
          name: RG DS build ${{ github.run_number }}
          files: banjo-rgds.apk
